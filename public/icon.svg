<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02070B" />
      <stop offset="45%" stop-color="#07243A" />
      <stop offset="100%" stop-color="#0E5E87" />
    </linearGradient>

    <!-- Outer Rim Light Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6AD5FF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#22D3EE" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.6" />
    </linearGradient>

    <!-- Orbit Ribbon Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6AD5FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Accent Node Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="glassSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Base Apple-style Squircle Background Container -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bgGrad)" />

  <!-- Ambient Subsurface Glow Radius -->
  <circle cx="256" cy="256" r="160" fill="#38BDF8" opacity="0.18" filter="url(#coreGlow)" />
  <circle cx="256" cy="256" r="100" fill="#22D3EE" opacity="0.12" filter="url(#coreGlow)" />

  <!-- Glass Rim Edge Highlight -->
  <rect x="4" y="4" width="504" height="504" rx="111" ry="111" fill="none" stroke="url(#rimGrad)" stroke-width="3" opacity="0.8" />

  <!-- Abstract Enterprise HealthOrbit Emblem (Tilted Orbital Structure) -->
  <g filter="url(#dropShadow)">
    <!-- Outer Orbital Ring -->
    <ellipse cx="256" cy="256" rx="150" ry="60" fill="none" stroke="url(#orbitGrad)" stroke-width="12" stroke-dasharray="8 4 300 4" transform="rotate(-28 256 256)" opacity="0.85" />

    <!-- Secondary Translucent Glass Counter-Orbit Ring -->
    <ellipse cx="256" cy="256" rx="140" ry="52" fill="none" stroke="#22D3EE" stroke-width="6" stroke-opacity="0.4" transform="rotate(32 256 256)" />

    <!-- Stylized "H" Topology Pillars & Connected Core -->
    <!-- Left Pillar -->
    <path d="M 180 150 C 170 200, 170 312, 180 362" fill="none" stroke="url(#orbitGrad)" stroke-width="22" stroke-linecap="round" />
    <path d="M 180 150 C 170 200, 170 312, 180 362" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.6" />

    <!-- Right Pillar -->
    <path d="M 332 150 C 342 200, 342 312, 332 362" fill="none" stroke="url(#orbitGrad)" stroke-width="22" stroke-linecap="round" />
    <path d="M 332 150 C 342 200, 342 312, 332 362" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.6" />

    <!-- Interlocking Data Orbit Bridge -->
    <path d="M 175 256 Q 256 220 337 256" fill="none" stroke="url(#nodeGrad)" stroke-width="16" stroke-linecap="round" />
    <path d="M 175 256 Q 256 292 337 256" fill="none" stroke="#6AD5FF" stroke-width="10" stroke-linecap="round" opacity="0.75" />

    <!-- Orbital Nodes (3D Spheres with highlights) -->
    <!-- Center Node -->
    <circle cx="256" cy="256" r="22" fill="url(#nodeGrad)" filter="url(#coreGlow)" />
    <circle cx="256" cy="256" r="14" fill="#FFFFFF" />
    <circle cx="252" cy="252" r="5" fill="#FFFFFF" opacity="0.9" />

    <!-- Left Node -->
    <circle cx="180" cy="256" r="14" fill="url(#orbitGrad)" />
    <circle cx="180" cy="256" r="8" fill="#FFFFFF" opacity="0.8" />

    <!-- Right Node -->
    <circle cx="332" cy="256" r="14" fill="url(#orbitGrad)" />
    <circle cx="332" cy="256" r="8" fill="#FFFFFF" opacity="0.8" />

    <!-- Top Node -->
    <circle cx="256" cy="145" r="10" fill="#6AD5FF" />
    <circle cx="256" cy="367" r="10" fill="#22D3EE" />
  </g>

  <!-- Specular Glass Sweep Coating (Apple iOS Style) -->
  <path d="M 0 0 L 512 0 L 512 200 Q 256 280 0 200 Z" fill="url(#glassSweep)" clip-path="url(#clipSquircle)" />
</svg>